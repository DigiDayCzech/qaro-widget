<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ČEZ Distribuce – Plánované odstávky</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  body { display: flex; justify-content: center; align-items: center; overflow: hidden; }
  a { display: inline-block; line-height: 0; max-width: 100%; max-height: 100%; }
  img { display: block; border: 0; max-width: 100%; max-height: 100vh; width: auto; height: auto; }
  .chyba { font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #64748b; padding: 8px; text-align: center; }
</style>
</head>
<body>
<script>
(function () {
  "use strict";

  /* Banner ČEZ Distribuce, plánované odstávky. Obrázek generuje ČEZ živě
     (Cache-Control: no-store), tady je jen obal pro iframe modul QARO.
     ?h=<identifikátor obce od ČEZ>&s=<250|468|728> */

  var ZAKLAD = "https://ppo.cezdistribuce.cz/ovm/";
  var ROZMERY = { "250": [250, 250], "468": [468, 60], "728": [728, 90] };
  var OBNOVA_MS = 15 * 60 * 1000;   /* otevřená stránka si banner po čase obnoví */

  var q = new URLSearchParams(location.search);
  var hash = q.get("h") || "";
  var s = ROZMERY[q.get("s")] ? q.get("s") : "250";

  if (!/^[A-Za-z0-9_-]{10,80}$/.test(hash)) {
    var p = document.createElement("div");
    p.className = "chyba";
    p.textContent = "Chybí identifikátor obce pro banner ČEZ Distribuce.";
    document.body.appendChild(p);
    return;
  }

  var a = document.createElement("a");
  a.href = ZAKLAD + hash + "/redirect";
  a.target = "_blank";   /* QARO sandbox nemá allow-top-navigation, popupy ano */
  a.rel = "noopener";

  var img = document.createElement("img");
  var zdroj = ZAKLAD + hash + "/image/" + s;
  img.src = zdroj;
  img.width = ROZMERY[s][0];
  img.height = ROZMERY[s][1];
  img.alt = "ČEZ Distribuce – Plánované odstávky";

  a.appendChild(img);
  document.body.appendChild(a);

  setInterval(function () { img.src = zdroj + "?t=" + Date.now(); }, OBNOVA_MS);
})();
</script>
</body>
</html>
